<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Portal RV</title>
<style>
  :root { --fundo: #f4f5f7; --cartao: #fff; --texto: #1f2328; --suave: #59636e; --borda: #d0d7de; --destaque: #2d6cdf; }
  @media (prefers-color-scheme: dark) {
    :root { --fundo: #0d1117; --cartao: #161b22; --texto: #e6edf3; --suave: #9198a1; --borda: #30363d; --destaque: #4c8dff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--fundo); color: var(--texto); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 480px; background: var(--cartao); border: 1px solid var(--borda); border-radius: 12px; padding: 28px; }
  h1 { font-size: 1.25rem; margin: 0 0 8px; }
  p { margin: 0 0 12px; color: var(--suave); }
  a.botao { display: inline-block; padding: 12px 18px; font-weight: 600; color: #fff; background: var(--destaque); border-radius: 8px; text-decoration: none; }
  .aviso { font-size: .875rem; }
</style>
</head>
<body>
<main>
  <h1>Abrindo o Portal RV&hellip;</h1>
  <p>O portal s&oacute; abre com a VPN ligada, inclusive dentro da empresa. Se n&atilde;o abrir sozinho, clique no bot&atilde;o.</p>
  <p><a class="botao" id="ir" href="http://10.0.8.11:8000/">Abrir o portal</a></p>
  <p class="aviso" id="info">Endere&ccedil;o atual: http://10.0.8.11:8000/ (atualizado em 12/11/2026 13:44)</p>
</main>
<script>
  // O endereco embutido acima pode estar velho: cache do navegador ou um deploy
  // do GitHub Pages que falhou (aconteceu em 09/11/2026). Por isso le o ip.json
  // de duas fontes e fica com o mais novo:
  // - ip.json do proprio Pages (depende do deploy);
  // - o mesmo arquivo direto do repositorio (raw), que vale logo apos o push.
  const FONTES = [
    'ip.json',
    'https://raw.githubusercontent.com/siteecommercerv/siteecommercerv.github.io/main/portal/ip.json',
  ];
  const EMBUTIDO = { url: 'http://10.0.8.11:8000/', atualizado: '12/11/2026 13:44', ts: 1794501856218 };

  // Arquivos antigos nao tem ts: converte "dd/mm/aaaa hh:mm".
  const quando = (d) => {
    if (d && d.ts) return Number(d.ts);
    const m = /^(\d{2})\/(\d{2})\/(\d{4}) (\d{2}):(\d{2})/.exec((d && d.atualizado) || '');
    return m ? new Date(+m[3], m[2] - 1, +m[1], +m[4], +m[5]).getTime() : 0;
  };

  const buscar = (url) => {
    const ctl = new AbortController();
    const prazo = setTimeout(() => ctl.abort(), 5000);
    return fetch(url + '?t=' + Date.now(), { cache: 'no-store', signal: ctl.signal })
      .then((r) => (r.ok ? r.json() : null))
      .catch(() => null)
      .finally(() => clearTimeout(prazo));
  };

  const ir = (d) => {
    document.getElementById('ir').href = d.url;
    document.getElementById('info').textContent = 'Endereço atual: ' + d.url + ' (atualizado em ' + d.atualizado + ')';
    location.replace(d.url);
  };

  Promise.all(FONTES.map(buscar)).then((lidos) => {
    const validos = lidos.filter((d) => d && /^http:\/\/10\.0\.8\.\d{1,3}:\d+\/$/.test(d.url));
    validos.push(EMBUTIDO);
    validos.sort((a, b) => quando(b) - quando(a));
    ir(validos[0]);
  });
</script>
</body>
</html>
